<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hanna Jansson — UX Designer in Stockholm focused on user experience and interaction design." />
    <title>Hanna Jansson — UX Designer</title>

    <!-- Switzer (primary font): non-blocking, weights 400/500/700 only -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,700&display=swap" />
    </noscript>

    <!-- Jacquarda (hero intro only): non-blocking, subsetted to "COMPLEXITY" only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&text=COMPLEXITY&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&text=COMPLEXITY&display=swap" />
    </noscript>

    <!-- Microsoft Clarity is loaded lazily, on first interaction, via useDeferredClarity() -->

    <script>
      // Restore path encoded by 404.html redirect
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          var q = new URLSearchParams(window.location.search).get('q');
          window.history.replaceState(
            null, '',
            '/ux-portfolio' + decodeURIComponent(p) + (q ? '?' + decodeURIComponent(q) : '') + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </body>
</html>
